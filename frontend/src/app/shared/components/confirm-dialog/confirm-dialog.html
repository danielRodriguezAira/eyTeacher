<h2 mat-dialog-title>
    <mat-icon class="dialog-icon">warning</mat-icon>
    {{ data.title }}
</h2>
<mat-dialog-content>
    <p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button (click)="cancel()">Cancelar</button>
    <button mat-flat-button color="warn" (click)="confirm()">Borrar</button>
</mat-dialog-actions>
