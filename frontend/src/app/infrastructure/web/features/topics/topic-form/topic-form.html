<div class="container">
    <mat-card>
        <mat-card-content>
            <h2>{{ isEditMode() ? 'Editar tema' : 'Nuevo tema' }}</h2>

            <form [formGroup]="topicForm" (ngSubmit)="saveTopic()">
                <div class="form-grid">
                    <mat-form-field appearance="outline">
                        <mat-label>Nombre</mat-label>
                        <input matInput formControlName="name"/>
                        @if (topicForm.get('name')?.hasError('required')) {
                            <mat-error>El nombre es obligatorio</mat-error>
                        }
                    </mat-form-field>

                    <app-rich-text-editor
                        formControlName="description"
                        label="Descripción"
                        [required]="true">
                    </app-rich-text-editor>
                </div>

                <div class="actions">
                    <button mat-stroked-button type="button" (click)="onCancel()">Cancelar</button>
                    <button mat-raised-button color="primary" [disabled]="topicForm.invalid">Guardar</button>
                </div>
            </form>
        </mat-card-content>
    </mat-card>
</div>
