<div class="container">
    <mat-card>
        <mat-card-content>
            <h2>{{ isEditMode() ? 'Editar Tarea' : 'Nueva Tarea' }}</h2>

            <form [formGroup]="taskForm" (ngSubmit)="saveTask()">
                <div class="form-grid">
                    <mat-form-field appearance="outline" class="full-width">
                        <mat-label>Descripción</mat-label>
                        <textarea matInput formControlName="description" rows="5"></textarea>
                        @if (taskForm.get('description')?.hasError('required')) {
                            <mat-error>La descripción es obligatoria</mat-error>
                        }
                    </mat-form-field>
                </div>

                <div class="actions">
                    <button mat-stroked-button type="button" (click)="onCancel()">
                        Cancelar
                    </button>
                    <button mat-raised-button color="primary" type="submit" [disabled]="taskForm.invalid">
                        Guardar
                    </button>
                </div>
            </form>
        </mat-card-content>
    </mat-card>
</div>
