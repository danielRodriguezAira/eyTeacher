<div class="container">
    <mat-card class="form-card">
        <mat-card-header>
            <mat-card-title>
                <h1>Nueva Solución</h1>
            </mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <form (ngSubmit)="sendSolution()" #solutionForm="ngForm">
                <mat-form-field appearance="fill" class="full-width">
                    <mat-label>Descripción de la solución</mat-label>
                    <textarea matInput
                              placeholder="Escribe aquí tu solución..."
                              [(ngModel)]="description"
                              name="description"
                              rows="6"
                              required></textarea>
                </mat-form-field>
                
                <div class="actions">
                    <button mat-button type="button" (click)="cancel()">
                        Cancelar
                    </button>
                    <button mat-raised-button color="primary" type="submit" [disabled]="!solutionForm.form.valid">
                        Enviar Solución
                    </button>
                </div>
            </form>
        </mat-card-content>
    </mat-card>
</div>
