<div class="container">
    <mat-card class="form-card">
        <mat-card-header>
            <mat-card-title>
                <h1>Nueva Solución</h1>
            </mat-card-title>
        </mat-card-header>
        <mat-card-content>
            @if (taskDescription()) {
                <div class="task-description">
                    <h3>Tarea</h3>
                    <div class="description" [innerHTML]="taskDescription() | safeHtml"></div>
                </div>
                
                @if (hintRequested() && !hint()) {
                    <div class="loading-container">
                        <mat-progress-bar mode="indeterminate" color="accent"></mat-progress-bar>
                        <p>Obteniendo pista...</p>
                    </div>
                }

                @if (hint()) {
                    <div class="hint-container">
                        <p><strong>Pista:</strong> {{ hint() }}</p>
                    </div>
                } @else if (!hintRequested()) {
                    <div class="hint-action">
                        <button mat-button type="button" (click)="requestHint()" class="hint-button">
                            <mat-icon>lightbulb</mat-icon>
                            Dame una pista!
                        </button>
                    </div>
                }
                <hr>
            }
            <form (ngSubmit)="sendSolution()" #solutionForm="ngForm">
                <app-rich-text-editor
                    [ngModel]="description()"
                    (ngModelChange)="description.set($event)"
                    name="description"
                    placeholder="Escribe aquí tu solución..."
                    [required]="true">
                </app-rich-text-editor>

                <div class="actions">
                    <button mat-button type="button" (click)="cancel()">
                        Cancelar
                    </button>
                    <button mat-raised-button color="primary" type="submit" [disabled]="!solutionForm.form.valid">
                        Enviar Solución
                    </button>
                </div>
            </form>
        </mat-card-content>
    </mat-card>
</div>
