<div class="container">
    @if (solution$ | async; as solution) {
        <mat-card class="detail-card">
            <mat-card-header>
                <mat-card-title>
                    <h1>Solución de {{ solution.student.firstName }} {{ solution.student.lastName }}</h1>
                </mat-card-title>
            </mat-card-header>
            <mat-card-content>
                <p class="description">{{ solution.description }}</p>

                @if ((userRole$ | async) === UserRole.TEACHER) {
                    <div class="correction-section">
                        @if (!showCorrectionForm) {
                            <button mat-raised-button color="primary" (click)="startCorrection()">
                                <mat-icon>edit</mat-icon>
                                Corregir
                            </button>
                        } @else {
                            <mat-form-field appearance="outline" class="full-width">
                                <mat-label>Corrección</mat-label>
                                <textarea matInput [(ngModel)]="correctionText" rows="5"></textarea>
                            </mat-form-field>
                            <button mat-raised-button color="accent" (click)="sendCorrection()">
                                <mat-icon>send</mat-icon>
                                Enviar corrección
                            </button>
                        }
                    </div>
                }
            </mat-card-content>
            <mat-card-actions>
                <button mat-button [routerLink]="['/task-detail', solution.task.id]">
                    <mat-icon>arrow_back</mat-icon>
                    Volver a la tarea
                </button>
            </mat-card-actions>
        </mat-card>
    } @else {
        <p>Cargando solución...</p>
    }
</div>
