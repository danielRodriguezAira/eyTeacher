<div class="container">
    <mat-card class="detail-card">
        <mat-card-header>
            <mat-card-title>
                <h1>
                    <mat-icon>people</mat-icon>
                    <span>Mis alumnos</span>
                </h1>
            </mat-card-title>
        </mat-card-header>
        <mat-card-content>
            @if (students().length === 0) {
                <p class="empty-message">No tienes alumnos asignados.</p>
            } @else {
                <table mat-table [dataSource]="students()" class="student-table">
                    <ng-container matColumnDef="name">
                        <th mat-header-cell *matHeaderCellDef>Nombre</th>
                        <td mat-cell *matCellDef="let student">{{ student.firstName }} {{ student.lastName }}</td>
                    </ng-container>

                    <ng-container matColumnDef="email">
                        <th mat-header-cell *matHeaderCellDef>Email</th>
                        <td mat-cell *matCellDef="let student">{{ student.email }}</td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="viewStudentTasks(row)" class="clickable-row"></tr>
                </table>
            }
        </mat-card-content>
    </mat-card>
</div>
