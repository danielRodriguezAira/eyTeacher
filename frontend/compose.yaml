services:
  eyteacher-frontend-app:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: eyteacher-frontend
    networks:
      - eyteacher-network
    restart: unless-stopped
    ports:
      - "8082:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.eyteacher.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.eyteacher.entrypoints=websecure"
      - "traefik.http.routers.eyteacher.tls=true"
      - "traefik.http.routers.eyteacher.tls.certresolver=letsencrypt"
      - "traefik.http.services.eyteacher.loadbalancer.server.port=80"

networks:
  eyteacher-network:
    external: true
