spring.application.name=eyTeacher

# Flyway (comun)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Seguridad (usar variable de entorno en lugar de hardcode)
jwt.secret=${JWT_SECRET:[eyteacher-super-secret-key-512bits-long-enough-for-hs512-algorithm-validation]}

# Perfil por defecto para desarrollo local
spring.profiles.default=dev