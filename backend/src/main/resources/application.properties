spring.application.name=eyTeacher

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/eyteacherdb
spring.datasource.username=eyteacher
spring.datasource.password=eyteacher
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Security Configuration
jwt.secret=eyteacher-super-secret-key-512bits-long-enough-for-hs512-algorithm-validation

# Server Configuration (HTTPS)
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=eyteacher
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=eyteacher
